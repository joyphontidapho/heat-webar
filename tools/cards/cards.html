<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>สร้างการ์ดเป้าหมาย</title>
  <link rel="stylesheet" href="../../css/app.css">
  <style>
    @page { size: A5 landscape; margin: 0; }
    body { background: #fff; margin: 0; }
    .page { width: 210mm; height: 148mm; page-break-after: always; overflow: hidden; }
    .page svg { display: block; width: 210mm; height: 148mm; }
    .qr-sheet { width: 210mm; height: 148mm; padding: 8mm; box-sizing: border-box; page-break-after: always; }
    .qr-sheet h1 { font-size: 16pt; margin: 0 0 4mm; }
    .qr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
    .qr-item { border: 0.4mm solid #0f172a; border-radius: 3mm; padding: 3mm; text-align: center; font-size: 10pt; line-height: 1.3; }
    .qr-item svg { width: 34mm; height: 34mm; display: block; margin: 0 auto 2mm; }
    .qr-item b { font-size: 12pt; }
  </style>
  <script src="../../config.js"></script>
  <script src="../lib/qrcode.js"></script>
  <script src="card-template.js"></script>
</head>
<body>
  <div id="out"></div>
  <script>
    // ใช้: cards.html?mode=cards  หรือ ?mode=qr  หรือ ?mode=single&scene=ar-1a
    var C = window.HEAT_CONFIG;
    var q = new URLSearchParams(location.search);
    var mode = q.get("mode") || "cards";
    var ready = Object.keys(C.scenes).filter(function (id) { return C.scenes[id].ready; });
    var seeds = { "ar-1a": 101, "ar-1b": 102, "ar-2a": 201, "ar-2b": 202, "ar-3a": 301, "ar-3b": 302, "ar-4a": 401, "ar-4b": 402, "ar-5a": 501, "ar-5b": 502 };
    var out = document.getElementById("out");
    function render() {
      if (mode === "single") {
        var id = q.get("scene");
        out.innerHTML = '<div class="page">' + HeatCards.buildCard(id, C, seeds[id] || 999) + "</div>";
      } else if (mode === "cards") {
        out.innerHTML = ready.map(function (id) { return '<div class="page">' + HeatCards.buildCard(id, C, seeds[id] || 999) + "</div>"; }).join("");
      } else {
        var items = [{ code: "เมนูรวม", title: C.kitTitle, url: C.siteUrl + "?openExternalBrowser=1" }].concat(ready.map(function (id) {
          return { code: C.scenes[id].code, title: C.scenes[id].title, url: HeatCards.sceneUrl(C, id) };
        }));
        out.innerHTML = '<div class="qr-sheet"><h1>QR code · ' + C.kitTitle + '</h1><div class="qr-grid">' + items.map(function (it) {
          return '<div class="qr-item"><svg viewBox="0 0 340 340">' + HeatCards.qrSvg(it.url, 0, 0, 340) + '</svg><b>' + it.code + '</b><br>' + it.title + '</div>';
        }).join("") + "</div></div>";
      }
      document.body.setAttribute("data-ready", "true");
    }
    (document.fonts ? document.fonts.load('700 40px "Sarabun"', "กขค").then(function () { return document.fonts.load('400 40px "Sarabun"', "กขค"); }) : Promise.resolve()).then(render, render);
  </script>
</body>
</html>
